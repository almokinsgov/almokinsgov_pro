<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07130f">
  <meta name="description" content="almokinsgov.dev is a home for practical digital tools, thoughtful experiments and useful projects.">
  <meta name="robots" content="index,follow">

  <meta property="og:type" content="website">
  <meta property="og:title" content="almokinsgov.dev">
  <meta property="og:description" content="Practical digital tools, thoughtful experiments and useful projects.">
  <meta property="og:url" content="https://almokinsgov.dev/">

  <title>almokinsgov.dev</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #06100d;
      --text: #f5faf7;
      --muted: #9fb2a8;
      --line: rgba(201, 236, 219, 0.14);
      --green: #58df9b;
      --green-soft: #b3f4d3;
      --blue: #6dc9ff;
      --max-width: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--background);
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgba(88, 223, 155, 0.14), transparent 30rem),
        radial-gradient(circle at 84% 82%, rgba(109, 201, 255, 0.11), transparent 32rem),
        linear-gradient(145deg, #040a08 0%, var(--background) 46%, #081712 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
      background-size: 48px 48px;
      content: "";
      mask-image: linear-gradient(to bottom, black, transparent 82%);
      pointer-events: none;
    }

    .ambient-glow {
      position: fixed;
      top: var(--pointer-y, 44%);
      left: var(--pointer-x, 58%);
      z-index: -1;
      width: 36rem;
      height: 36rem;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(88, 223, 155, 0.085), transparent 68%);
      transform: translate(-50%, -50%);
      transition: top 180ms ease-out, left 180ms ease-out;
      pointer-events: none;
    }

    .page-shell {
      display: grid;
      min-height: 100vh;
      grid-template-rows: auto 1fr auto;
    }

    .site-header,
    .site-main,
    .site-footer {
      width: min(calc(100% - 40px), var(--max-width));
      margin-inline: auto;
    }

    .site-header {
      display: flex;
      align-items: center;
      min-height: 92px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 750;
      letter-spacing: -0.01em;
      text-decoration: none;
    }

    .brand-mark {
      position: relative;
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(179, 244, 211, 0.3);
      border-radius: 12px;
      background: linear-gradient(145deg, rgba(88, 223, 155, 0.16), rgba(109, 201, 255, 0.08));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .brand-mark::before,
    .brand-mark::after {
      position: absolute;
      border: 2px solid var(--green-soft);
      border-radius: 999px;
      content: "";
    }

    .brand-mark::before {
      width: 18px;
      height: 9px;
      transform: rotate(-32deg);
    }

    .brand-mark::after {
      width: 7px;
      height: 16px;
      border-color: var(--blue);
      transform: translate(6px, -2px) rotate(28deg);
    }

    .brand:focus-visible {
      outline: 3px solid rgba(109, 201, 255, 0.65);
      outline-offset: 5px;
      border-radius: 8px;
    }

    .site-main {
      display: grid;
      place-items: center;
      padding-block: clamp(48px, 8vw, 112px);
    }

    .hero {
      position: relative;
      width: 100%;
      padding-block: clamp(70px, 12vw, 160px);
      text-align: center;
    }

    .hero::before {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: -1;
      width: min(72vw, 820px);
      aspect-ratio: 1;
      border: 1px solid rgba(179, 244, 211, 0.07);
      border-radius: 50%;
      content: "";
      box-shadow:
        0 0 0 80px rgba(109, 201, 255, 0.018),
        0 0 0 160px rgba(88, 223, 155, 0.012);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.45rem, 11vw, 9rem);
      font-weight: 830;
      letter-spacing: -0.078em;
      line-height: 0.88;
    }

    .domain-dot {
      color: var(--green);
      text-shadow: 0 0 30px rgba(88, 223, 155, 0.42);
    }

    .hero-description {
      max-width: 680px;
      margin: 34px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.8vw, 1.22rem);
      line-height: 1.7;
    }

    .hero-description strong {
      color: var(--text);
      font-weight: 680;
    }

    .site-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-block: 24px 34px;
      border-top: 1px solid var(--line);
      color: #7f9288;
      font-size: 0.78rem;
    }

    .footer-note {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .reveal {
      opacity: 0;
      transform: translateY(16px);
      animation: reveal 680ms cubic-bezier(0.2, 0.75, 0.25, 1) forwards;
    }

    .reveal-delay-1 {
      animation-delay: 100ms;
    }

    .reveal-delay-2 {
      animation-delay: 200ms;
    }

    @keyframes reveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 620px) {
      .site-header,
      .site-main,
      .site-footer {
        width: min(calc(100% - 24px), var(--max-width));
      }

      .site-header {
        min-height: 76px;
      }

      .hero {
        padding-block: 80px 100px;
      }

      h1 {
        font-size: clamp(3.2rem, 18vw, 5.2rem);
      }

      .hero-description {
        margin-top: 26px;
      }

      .site-footer {
        align-items: flex-start;
        flex-direction: column;
        padding-bottom: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .ambient-glow {
        display: none;
      }
    }
  </style>
<script>
  window.RWAS_CONFIG = {
    useProxy: true
  };
  
</script>

<script src="./rwas2/extensions/rwas-config-storage.js" defer></script>
<script src="./rwas2/extensions/rwas-map-view-plugin.js" defer></script>
<script src="./rwas2/extensions/rwas-notification-plugin.js" defer></script>
<script src="./rwas2/extensions/rwas-agent-metadata-plugin.js" defer></script>
<script src="./rwas2/extensions/rwas-mcp-config-plugin.js" defer></script>
<script src="./rwas2/extensions/rwas-jsonld-plugin.js" defer></script>
<script src="./rwas2/extensions/rwas-admin-ui-plugin.js" defer></script>
<script src="./rwas2/extensions/rwas-alert-dismissal-plugin.js" defer></script>
<script src="./rwas2/extensions/rwas-far-north-impact.js" defer></script>
<script src="./rwas2/extensions/rwas-far-north-placenames-plugin.js" defer></script>
<script src="./rwas2/extensions/rwas-far-north-areas-plugin.js" defer></script>
<script src="./rwas2/extensions/rwas-nzta-conditions-plugin.js" defer></script>
<script src="./rwas2/rwas-popup.js" defer data-rwas data-rwas-config-url="./rwas2/almokinsgov.dev.json"></script>
  
</head>
<body>
  <div class="ambient-glow" aria-hidden="true"></div>

  <div class="page-shell">
    <header class="site-header reveal">
      <a class="brand" href="/" aria-label="almokinsgov.dev home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>almokinsgov.dev</span>
      </a>
    </header>

    <main class="site-main">
      <section class="hero" aria-labelledby="page-title">
        <h1 id="page-title" class="reveal reveal-delay-1">
          almokinsgov<span class="domain-dot">.dev</span>
        </h1>

        <p class="hero-description reveal reveal-delay-2">
          A home for <strong>practical digital tools</strong>, thoughtful experiments and useful projects.
        </p>
      </section>
    </main>

    <footer class="site-footer reveal reveal-delay-2">
      <span>© <span id="current-year"></span> almokinsgov.dev</span>
      <span class="footer-note">Built With Curiosity</span>
    </footer>
  </div>

  <script>
    (() => {
      "use strict";

      const yearElement = document.getElementById("current-year");
      const root = document.documentElement;
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (yearElement) {
        yearElement.textContent = String(new Date().getFullYear());
      }

      if (!reducedMotion) {
        window.addEventListener("pointermove", (event) => {
          root.style.setProperty("--pointer-x", `${event.clientX}px`);
          root.style.setProperty("--pointer-y", `${event.clientY}px`);
        }, { passive: true });
      }
    })();
  </script>
</body>
</html>
