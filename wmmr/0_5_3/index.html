<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123f54">
  <title>Who Maintains My Road?</title>
  <link rel="stylesheet" href="styles-v0.5.3.css">
</head>
<body>
  <header class="site-header">
    <div class="page-width">
      <p class="eyebrow">Far North road information</p>
      <h1>Who Maintains My Road?</h1>
      <p class="intro">Search for a road to see who owns it and who maintains it.</p>
    </div>
  </header>

  <main class="page-width main-content">
    <section class="search-card" aria-labelledby="searchHeading">
      <h2 id="searchHeading">Find A Road</h2>
      <label for="roadSearch">Road name</label>
      <div class="search-row">
        <input
          id="roadSearch"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="For example, Pukepoto Road"
          aria-describedby="searchHelp"
        >
        <button id="clearSearch" type="button" class="clear-button" hidden>Clear</button>
      </div>
      <p class="search-help" id="searchHelp">You can enter a full road name or part of a road name.</p>
    </section>

    <section class="results-pane" aria-labelledby="resultsHeading">
      <div class="results-heading-row">
        <h2 id="resultsHeading">Road Results</h2>
        <p id="resultSummary" class="result-summary" aria-live="polite"></p>
      </div>
      <div id="emptyState" class="empty-state">Start typing a road name to see roads.</div>
      <div id="roadList" class="road-list" role="listbox" aria-label="Road results"></div>
      <nav id="pagination" class="pagination" aria-label="Road result pages" hidden>
        <button id="previousPage" type="button" class="pagination-button">Previous</button>
        <span id="pageStatus" class="page-status" aria-live="polite"></span>
        <button id="nextPage" type="button" class="pagination-button">Next</button>
      </nav>
      <section id="roadDetails" class="road-details" aria-live="polite" hidden></section>
    </section>
  </main>

  <script src="roads-v0.5.3.js"></script>
  <script src="app-v0.5.3.js"></script>
</body>
</html>
